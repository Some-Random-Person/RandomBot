name: Randombot quick checks

on:
  push:
    paths:
      - "api/**"
  pull_request:
    paths:
      - "api/**"

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Use Node.js
        uses: actions/setup-node@v1
        with:
          node-version: "22"
      - name: Install dependencies
        run: cd api && npm install
      - name: Run Prettier
        run: cd api && npm run format
      - name: Run ESLint
        run: cd api && npm run lint
      - name: Run tests
        run: cd api && npm test
